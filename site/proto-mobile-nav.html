<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Прототип мобильной навигации</title>
  <style>
    :root {
      --color-border: #E5E7EB;
      --accent-600: #1F6FEB;
      --accent-ink: #FFFFFF;
      --motion-200: 200ms;
      --motion-250: 250ms;
    }
    body { font-family: sans-serif; }
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-600);
      color: var(--accent-ink);
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 44px;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--motion-200) ease-out;
      z-index: 80;
    }
    .sheet {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: clamp(220px, 80vw, 288px);
      background: #fff;
      border-left: 1px solid var(--color-border);
      box-shadow: 0 6px 30px rgba(0, 0, 0, .18);
      transform: translateX(100%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: transform var(--motion-250) ease-out, opacity var(--motion-200) ease-out;
      z-index: 81;
      padding: 16px;
    }
    .sheet .close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
    }
    .sheet .nav-list { list-style: none; margin: 50px 0 0; padding: 0; display: grid; gap: 8px; }
    .sheet .nav-list a { display: block; padding: 12px 14px; border: 1px solid var(--color-border); text-decoration: none; }
    body[data-menu="open"] { overflow: hidden; }
    [data-menu="open"] .backdrop {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    [data-menu="open"] .sheet {
      transform: translateX(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    main { padding: 1rem; }
  </style>
</head>
<body>
  <main id="main">
    <button class="menu-toggle" id="menuToggle" aria-controls="mobile-menu" aria-expanded="false">Меню</button>
    <p>Основной контент страницы.</p>
  </main>

  <div class="backdrop" hidden></div>
  <nav class="sheet" id="mobile-menu" aria-label="Мобильное меню" aria-hidden="true">
    <button class="close" type="button" aria-label="Закрыть" title="Закрыть">×</button>
    <ul class="nav-list">
      <li><a href="#">Программа</a></li>
      <li><a href="#">Что узнаете</a></li>
      <li><a href="#">Вебинар</a></li>
    </ul>
  </nav>

  <script>
    (function() {
      const btn = document.getElementById('menuToggle');
      const sheet = document.getElementById('mobile-menu');
      const backdrop = document.querySelector('.backdrop');
      const closeX = sheet?.querySelector('.close');
      const mainEl = document.getElementById('main');
      let menuHistoryPushed = false;

      const setOpen = (open) => {
        if (open) {
          document.body.setAttribute('data-menu', 'open');
          btn.setAttribute('aria-expanded', 'true');
          sheet.setAttribute('aria-hidden', 'false');
          mainEl?.setAttribute('inert', '');
          mainEl?.setAttribute('aria-hidden', 'true');
          backdrop.hidden = false;
          (sheet.querySelector('a,button') || closeX)?.focus();
          try {
            history.pushState({ menu: true }, '', location.href);
            menuHistoryPushed = true;
          } catch {}
        } else {
          document.body.removeAttribute('data-menu');
          btn.setAttribute('aria-expanded', 'false');
          sheet.setAttribute('aria-hidden', 'true');
          mainEl?.removeAttribute('inert');
          mainEl?.removeAttribute('aria-hidden');
          backdrop.hidden = true;
          btn.focus();
          try {
            if (menuHistoryPushed) {
              history.back();
              menuHistoryPushed = false;
            }
          } catch {}
        }
      };

      btn?.addEventListener('click', () => setOpen(true));
      closeX?.addEventListener('click', () => setOpen(false));
      backdrop?.addEventListener('click', () => setOpen(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && btn?.getAttribute('aria-expanded') === 'true') {
          setOpen(false);
        }
      });
      window.addEventListener('popstate', () => {
        if (btn?.getAttribute('aria-expanded') === 'true') {
          setOpen(false);
        }
      });
      sheet?.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const nodes = Array.from(sheet.querySelectorAll('a,button,[tabindex]:not([tabindex="-1"])'));
        if (!nodes.length) return;
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });
    })();
  </script>
</body>
</html>
