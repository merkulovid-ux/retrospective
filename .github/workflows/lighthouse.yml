name: Lighthouse CI

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI (live)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://merkulovid-ux.github.io/retrospective/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ''
