name: Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n          submodules: false\n      - name: Trust workspace for git\n        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server
        run: |
          for i in {1..20}; do curl -sSf http://localhost:8080/ && break || sleep 1; done
      - name: Run smoke
        run: node scripts/smoke.js http://localhost:8080/index.html

