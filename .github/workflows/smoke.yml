name: Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Debug env and git
        run: |
          set -x
          git --version || true
          git status || true
          env | sort | sed -n '1,120p'
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server (wait-on)
        run: npx -y wait-on http://localhost:8080/index.html
      - name: Run smoke
        run: node scripts/smoke.js http://localhost:8080/index.html
