name: Smoke

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository archive
        run: |
          set -e
          curl -L ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.zip -o repo.zip
          unzip -q repo.zip
          shopt -s dotglob nullglob
          mv -f ${{ github.repository##*/ }}-*/* .
          rm -rf ${{ github.repository##*/ }}-* repo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server (wait-on)
        run: npx -y wait-on http://localhost:8080/index.html
      - name: Run smoke
        run: node scripts/smoke.js http://localhost:8080/index.html
