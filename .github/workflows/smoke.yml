name: Smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/smoke.yml'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Diagnostics
        run: |
          set -x
          node -v
          npm -v
          env | sort | sed -e 's/\(.*\)/env: \1/'
          ls -la | sed -e 's/^/ls: /'
      - name: Download repository archive
        run: |
          set -e
          curl -L "${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.zip" -o repo.zip
          unzip -q repo.zip
          dir=$(find . -maxdepth 1 -type d -name "*-*" | head -n 1)
          cp -a "$dir"/. .
          rm -rf "$dir" repo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server (wait-on)
        run: npx -y wait-on http://localhost:8080/index.html
      - name: Run smoke
        run: node scripts/smoke.js http://localhost:8080/index.html
