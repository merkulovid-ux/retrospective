name: Smoke

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server
        run: |
          for i in {1..20}; do curl -sSf http://localhost:8080/ && break || sleep 1; done
      - name: Run smoke
        run: node scripts/smoke.js http://localhost:8080/retrospective/

