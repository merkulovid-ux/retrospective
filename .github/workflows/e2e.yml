name: E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'tests/**'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'site/**'
      - 'assets/**'
      - 'tests/**'
      - 'playwright.config.*'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download repository archive
        run: |
          set -e
          curl -L "${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.zip" -o repo.zip
          unzip -q repo.zip
          dir=$(find . -maxdepth 1 -type d -name "*-*" | head -n 1)
          cp -a "$dir"/. .
          rm -rf "$dir" repo.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start static server
        run: npx http-server -p 8080 -c-1 . &
      - name: Wait for server (wait-on)
        run: npx -y wait-on http://localhost:8080/index.html
      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:8080/
          E2E_PATH: /index.html
        run: npx playwright test --config=playwright.config.ts
