name: Deploy to Selectel Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Selectel CLI
        run: pip install selectel-cli

      - name: Upload files to Selectel Storage
        env:
          SCLOUD_USER: ${{ secrets.SELECTEL_USER }}
          SCLOUD_PASSWORD: ${{ secrets.SELECTEL_PASSWORD }}
        run: |
          scloud storage upload --source . --container ${{ secrets.SELECTEL_CONTAINER }} --delete-after
